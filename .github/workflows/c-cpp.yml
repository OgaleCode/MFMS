name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

 steps:
    - uses: actions/checkout@v4
    - name: Compile C Project
      run: gcc main.c assets.c budget.c employees.c reports.c suppliers.c -o mfms_program

      
